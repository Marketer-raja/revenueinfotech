    <script>
      // The dark footer drawn by the React app uses buttons that only scroll to
      // the top. Send each one to its real page instead.
      (function () {
        var PAGES = {
          "editorial ethics": "/editorial-ethics.html",
          "peer review process": "/peer-review-process.html",
          "privacy policy": "/privacy-policy.html",
          "terms of service": "/terms-of-service.html",
          "sponsorship disclosure": "/sponsorship-disclosure.html",
          "contact": "/contact.html",
          "contact us": "/contact.html"
        };
        document.addEventListener("click", function (e) {
          var btn = e.target.closest && e.target.closest("footer button");
          if (!btn) return;
          var target = PAGES[(btn.textContent || "").trim().toLowerCase()];
          if (target) {
            e.preventDefault();
            e.stopImmediatePropagation();
            window.location.href = target;
          }
        }, true); // capture phase: runs before React's own click handler
      })();
    </script>
