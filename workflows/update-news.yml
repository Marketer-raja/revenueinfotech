name: Collect technology news candidates
on:
  schedule:
    - cron: "17 */3 * * *" # collect candidate headlines every three hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py
      - name: Commit candidate queue only
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json news/index.html
          git diff --cached --quiet || (git commit -m "Refresh editorial news candidates" && git push)
