name: Update news
on:
  schedule:
    - cron: "17 * * * *"      # every hour at minute 17
  workflow_dispatch:           # also lets you run it manually
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json news/index.html sitemap.xml
          git diff --cached --quiet || (git commit -m "Update news" && git push)
