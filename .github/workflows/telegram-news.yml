name: Telegram news review
on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: Send only a test message
        type: boolean
        default: true
      allow_private:
        description: Allow this manual run on a private repo (uses runner allowance)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: revenueinfotech-editorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  telegram:
    if: github.event.repository.private == false || (github.event_name == 'workflow_dispatch' && inputs.allow_private == true)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Poll Telegram and prepare approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || false }}
        run: python3 scripts/telegram_bot.py
      - name: Save queue and notification state
        run: |
          git config user.name revenueinfotech-bot
          git config user.email revenueinfotech-bot@users.noreply.github.com
          git add scheduled-news.json
          if [ -f telegram-state.json ]; then git add telegram-state.json; fi
          git diff --cached --quiet || (git commit -m 'Update Telegram editorial queue' && git push)
