name: Telegram news review
on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: Send only a test message
        type: boolean
        default: true
      allow_private:
        description: Allow this manual run on a private repo (uses runner allowance)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: revenueinfotech-editorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  telegram:
    if: github.event.repository.private == false || vars.NEWS_PRIVATE_SELF_HOSTED == 'yes' || (github.event_name == 'workflow_dispatch' && inputs.allow_private == true)
    runs-on: ${{ fromJSON((github.event.repository.private && vars.NEWS_PRIVATE_SELF_HOSTED == 'yes') && '["self-hosted","linux","revenueinfotech"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Poll Telegram and prepare approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || false }}
        run: python3 scripts/telegram_bot.py
      - name: Publish approved articles and rebuild website
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.test_only == false
        run: |
          python3 scripts/publish_scheduled.py
          if ! git diff --quiet -- home-news.json; then python3 scripts/build_articles.py; fi
      - name: Save queue, publication and notification state
        run: |
          git config user.name revenueinfotech-bot
          git config user.email revenueinfotech-bot@users.noreply.github.com
          git add scheduled-news.json home-news.json articles sitemap.xml
          if [ -f telegram-state.json ]; then git add telegram-state.json; fi
          git diff --cached --quiet || (git commit -m 'Update Telegram editorial queue' && git push)
      - name: Confirm committed publication in Telegram
        if: steps.release.outputs.released != '' && steps.release.outputs.released != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASED: ${{ steps.release.outputs.released }}
        run: |
          PYTHONPATH=scripts python3 -c 'import os; from telegram_bot import api; api("sendMessage", chat_id=int(os.environ["TELEGRAM_CHAT_ID"]), text=os.environ["RELEASED"]+" approved articles committed to your website repository. Check https://revenueinfotech.com/ after hosting deployment.")'
