name: Publish approved news every 10 minutes
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      allow_private:
        description: Allow this manual hosted run on a private repo (uses runner allowance)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: revenueinfotech-editorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false || vars.NEWS_PRIVATE_SELF_HOSTED == 'yes' || (github.event_name == 'workflow_dispatch' && inputs.allow_private == true)
    runs-on: ${{ fromJSON((github.event.repository.private && vars.NEWS_PRIVATE_SELF_HOSTED == 'yes') && '["self-hosted","linux","revenueinfotech"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Release up to ten approved articles and build pages
        run: |
          python3 scripts/publish_scheduled.py
          if ! git diff --quiet -- home-news.json; then python3 scripts/build_articles.py; fi
      - name: Commit publication
        run: |
          git config user.name revenueinfotech-bot
          git config user.email revenueinfotech-bot@users.noreply.github.com
          git add home-news.json scheduled-news.json articles sitemap.xml
          git diff --cached --quiet || (git commit -m 'Publish approved news' && git push)
